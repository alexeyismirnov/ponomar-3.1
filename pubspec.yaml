name: ponomar
description: Orthodox Church Calendar

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.3.2+23

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  shared_preferences: ^2.5.3
  auto_size_text: ^3.0.0
  easy_localization: ^3.0.7
  path: ^1.9.1
  flutter_svg: ^2.2.1
  sqflite: ^2.3.3+1
  supercharged: ^2.1.1
  json_annotation: ^4.8.1
  sprintf: ^7.0.0
  group_list_view: ^1.1.1
  jiffy: ^6.4.3
  quiver: ^3.2.2
  flutter_archive: ^6.0.3
  audioplayers: ^6.5.1
  page_view_indicators: ^2.0.0
  dots_indicator: ^2.1.0
  share_plus: ^12.0.1
  flutter_markdown: ^0.7.7+1
  html: ^0.15.0
  html2md: ^1.3.2
  screenshot: ^3.0.0
  rate_my_app: ^2.3.2
  fluttertoast: ^9.0.0
  in_app_review: ^2.0.11
  rxdart: ^0.27.7
  firebase_core: ^4.0.0
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^3.0.1
  flutter_html_svg: ^3.0.0
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2

  vocsy_epub_viewer:
    git:
      url: https://github.com/alexeyismirnov/vocsy_epub_viewer.git
  flutter_toolkit:
    path: /home/alexey/workspace/flutter_toolkit

# https://github.com/flutter/flutter/issues/153337#issuecomment-2288049840
dependency_overrides:
  win32: ^5.5.4

dev_dependencies:
  build_runner: ^2.4.4
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  change_app_package_name: ^1.1.0

flutter_icons:
  ios: true
  android: true
  image_path_ios: "assets/images/newicon2.png"
  image_path_android: "assets/images/newicon.png"

flutter_native_splash:
  image: assets/images/launch_icon.png
  color: "ffffff"
  image_dark: assets/images/launch_icon2.png
  color_dark: "000000"


flutter:
  uses-material-design: true
  fonts:
    - family: Ponomar
      fonts:
        - asset: assets/fonts/PonomarUnicode.ttf

  assets:
    - assets/images/
    - assets/calendar/
    - assets/bible/
    - assets/books/
    - assets/epubs/
    - assets/saints/
    - assets/icons/
    - assets/translations/ru/
