name: ponomar
description: Orthodox Church Calendar

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.3.2+18

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_native_splash: ^2.4.8
  shared_preferences: ^2.5.5
  auto_size_text: ^3.0.0
  easy_localization: ^3.0.8
  path: ^1.9.1
  flutter_svg: ^2.3.0
  sqflite: ^2.4.3
  supercharged: ^2.1.1
  json_annotation: ^4.12.0
  sprintf: ^7.0.0
  group_list_view: ^1.1.1
  jiffy: ^6.4.5
  quiver: ^3.2.2
  flutter_archive: ^6.3.1
  audioplayers: ^6.8.1
  page_view_indicators: ^2.0.0
  dots_indicator: ^4.0.1
  share_plus: ^13.3.0
  html: ^0.15.6
  html2md: ^1.3.2
  screenshot: ^3.0.0
  rate_my_app: ^2.4.1
  fluttertoast: ^10.0.0
  rxdart: ^0.28.0
  firebase_core: ^4.13.0
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  flutter_html_svg: ^3.0.0
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2

  vocsy_epub_viewer:
    git:
      url: https://github.com/alexeyismirnov/vocsy_epub_viewer.git
  flutter_toolkit:
    path: ../flutter_toolkit
  flutter_markdown_plus: ^1.0.12


dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_icons:
  ios: true
  android: true
  image_path_ios: "assets/images/newicon2.png"
  image_path_android: "assets/images/newicon.png"

flutter_native_splash:
  image: assets/images/launch_icon.png
  color: "ffffff"
  image_dark: assets/images/launch_icon2.png
  color_dark: "000000"


flutter:
  uses-material-design: true
  fonts:
    - family: Ponomar
      fonts:
        - asset: assets/fonts/PonomarUnicode.ttf

  assets:
    - assets/images/
    - assets/calendar/
    - assets/bible/
    - assets/books/
    - assets/epubs/
    - assets/saints/
    - assets/icons/
    - assets/troparia/
    - assets/translations/en/
    - assets/translations/ru/
    - assets/translations/zh-CN/
    - assets/translations/zh-HK/
